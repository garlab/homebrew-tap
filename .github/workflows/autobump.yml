name: Update Probl

on:
  repository_dispatch:
    types: [probl-release]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag (empty means latest)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: probl-update
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'garlab/homebrew-tap' && github.ref == 'refs/heads/main'
    environment: homebrew
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify immutable release and build provenance
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: python3 ci/releases.py prepare "$RUNNER_TEMP/probl-update.json"
      # Do not make write credentials available while fetching upstream assets.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.prepare.outputs.ready == 'true'
        id: app
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: garlab
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: Open idempotent formula update PR
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 ci/releases.py open-pr "$RUNNER_TEMP/probl-update.json"
