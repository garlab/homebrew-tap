name: Update formulae

on:
  repository_dispatch:
    types: [gloss-release, probl-release]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      formula:
        description: Formula the tag belongs to
        required: true
        type: choice
        options: [gloss, probl]
      tag:
        description: Stable release tag (empty means latest)
        required: false
        type: string

permissions:
  contents: read

jobs:
  update:
    if: github.repository == 'garlab/homebrew-tap' && github.ref == 'refs/heads/main'
    environment: homebrew
    runs-on: ubuntu-latest
    strategy:
      # One upstream's failure must not hold back the other's update.
      fail-fast: false
      matrix:
        formula: [gloss, probl]
    concurrency:
      group: update-${{ matrix.formula }}
      cancel-in-progress: false
    env:
      FORMULA: ${{ matrix.formula }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify immutable release and build provenance
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          # A tag belongs to one formula. The others check their latest release.
          RELEASE_TAG: >-
            ${{ (inputs.formula == matrix.formula && inputs.tag) ||
                (github.event.action == format('{0}-release', matrix.formula) && github.event.client_payload.tag) || '' }}
        run: python3 ci/releases.py prepare "$FORMULA" "$RUNNER_TEMP/$FORMULA-update.json"
      # Do not make write credentials available while fetching upstream assets.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.prepare.outputs.ready == 'true'
        id: app
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: garlab
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - name: Open idempotent formula update PR
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 ci/releases.py open-pr "$RUNNER_TEMP/$FORMULA-update.json"
