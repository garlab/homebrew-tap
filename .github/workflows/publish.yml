name: Publish verified bottles

on:
  workflow_run:
    workflows: [brew test-bot]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful brew test-bot PR workflow run ID (same verification applies)
        type: string
        required: true

permissions: {}

# Serialise publishers. An update tested against an obsolete main must be rebuilt.
concurrency:
  group: tap-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'garlab/homebrew-tap' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'))
    environment: homebrew
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    steps:
      # This is trusted main, never a PR checkout or script from an artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify exact PR, upstream provenance and successful bottle run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BOT_LOGIN: ${{ vars.HOMEBREW_BOT_LOGIN }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          cp ci/releases.py "$RUNNER_TEMP/probl-release-gate.py"
          python3 "$RUNNER_TEMP/probl-release-gate.py" gate "$RUN_ID"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.gate.outputs.ready == 'true'
        id: app
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: garlab
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
      - uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        if: steps.gate.outputs.ready == 'true'
        id: homebrew
        env:
          GITHUB_SHA: ${{ steps.gate.outputs.base }}
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: Homebrew/actions/git-user-config@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        if: steps.gate.outputs.ready == 'true'
        id: git
      - name: Publish bottles from the checked PR head
        id: bottles
        if: steps.gate.outputs.ready == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git.outputs.email }}
          PR: ${{ steps.gate.outputs.pr }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
          GITHUB_SHA: ${{ steps.gate.outputs.base }}
          TAP_PATH: ${{ steps.homebrew.outputs.repository-path }}
          RUN_ID: ${{ steps.gate.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.gate.outputs.attempt }}
        run: |
          test "$(git -C "$TAP_PATH" rev-parse HEAD)" = "$GITHUB_SHA"
          brew pr-pull --no-upload --retain-bottle-dir --tap=garlab/homebrew-tap \
            --workflows=tests.yml --head-sha="$HEAD_SHA" \
            --artifact-pattern="bottles_${RUN_ID}_${RUN_ATTEMPT}_*" "$PR"
      - name: Merge bottle metadata and audit the resulting formula
        if: steps.gate.outputs.ready == 'true'
        working-directory: ${{ steps.bottles.outputs.bottle_path }}
        env:
          BOTTLES: ${{ steps.bottles.outputs.bottle_path }}
          TAG: ${{ steps.gate.outputs.tag }}
        run: |
          python3 "$RUNNER_TEMP/probl-release-gate.py" check-bottles "$BOTTLES" "$TAG"
          brew bottle --merge --write ./*.bottle.json
          brew audit --skip-style garlab/tap/probl
      - name: Upload bottles to a draft (verify existing files on retry)
        id: upload
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOTTLES: ${{ steps.bottles.outputs.bottle_path }}
          TAG: ${{ steps.gate.outputs.tag }}
          BASE_SHA: ${{ steps.gate.outputs.base }}
        run: python3 "$RUNNER_TEMP/probl-release-gate.py" upload-bottles "$BOTTLES" "$TAG" "$BASE_SHA"
      - name: Attest published bottles
        if: steps.gate.outputs.ready == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.bottles.outputs.bottle_path }}/*.tar.gz
      - name: Recheck PR and main before pushing
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.gate.outputs.pr }}
          HEAD_SHA: ${{ steps.gate.outputs.head }}
          BASE_SHA: ${{ steps.gate.outputs.base }}
        run: python3 "$RUNNER_TEMP/probl-release-gate.py" recheck "$PR" "$HEAD_SHA" "$BASE_SHA"
      - name: Publish the complete attested bottle release
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.gate.outputs.tag }}
          RELEASE_ID: ${{ steps.upload.outputs.release_id }}
        run: python3 "$RUNNER_TEMP/probl-release-gate.py" publish-bottles "$TAG" "$RELEASE_ID"
      - name: Push the verified publication without rebasing or force
        if: steps.gate.outputs.ready == 'true'
        env:
          TAP_PATH: ${{ steps.homebrew.outputs.repository-path }}
        run: git -C "$TAP_PATH" push origin HEAD:main
